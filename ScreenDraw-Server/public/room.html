<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src * ws: wss: http: https:; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self'" />
  <title>ScreenDraw</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="room">
  <!-- The shared screen fills the window; the controls sit over it and fold away. -->
  <main class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="relayCanvas" class="hidden"></canvas>
    <div id="stickerLayer" class="stickerlayer"></div>
    <canvas id="board"></canvas>
    <div id="stickerTop" class="stickerlayer top"></div>
    <div class="empty" id="empty">
      <div class="emptybox">
        <h2 id="emptyTitle">Connecting…</h2>
        <p id="emptyText"></p>
        <p class="step" id="emptyStep"></p>
      </div>
    </div>
    <div class="stats hidden" id="stats"></div>
  </main>

  <!-- Top strip -->
  <header class="strip chrome" id="topbar">
    <div class="roomid">
      <img class="mark" src="favicon.svg" alt="" />
      <span class="label">Room</span>
      <span class="roomcode" id="roomCode"></span>
      <button class="ib" id="copyInvite" aria-label="Copy invite link" data-tip="Copy invite link"><i data-icon="link"></i></button>
    </div>

    <div class="live hidden" id="presenterBanner">
      <span class="livedot" aria-hidden="true"></span>
      <span id="presenterText"></span>
      <span class="meta hidden" id="presenterMeta"></span>
    </div>

    <div class="grow"></div>

    <div class="mine" id="presenterTools">
      <span id="desktopControls" class="hidden">
        <button class="tb" id="drawMine" data-tip="Draw on your own screen (Ctrl+Shift+D)"><i data-icon="pencil"></i><span>Draw on screen</span></button>
        <label class="tb toggle" data-tip="Show everyone's drawings on your screen"><input type="checkbox" id="showOverlay" checked /><i data-icon="layers"></i><span>Overlay</span></label>
      </span>
      <label class="tb toggle hidden" id="hidePreviewBox" data-tip="Hide your own preview to save CPU/GPU. Viewers aren't affected."><input type="checkbox" id="hidePreview" /><i data-icon="eye-off"></i><span>Hide preview</span></label>
    </div>

    <div class="members" id="members"></div>
    <span class="status warn" id="status">Connecting…</span>

    <button class="btn primary" id="shareBtn"><i data-icon="monitor-up"></i><span>Share screen</span></button>
    <button class="btn danger hidden" id="stopBtn"><i data-icon="monitor-off"></i><span>Stop sharing</span></button>

    <div class="rule"></div>

    <span class="viewer" id="viewerTools">
    <div class="audio">
      <button class="ib" id="soundBtn" aria-label="Sound" data-tip="Sound from the shared screen"><i data-icon="volume-x"></i></button>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
    </div>
    <label class="selectwrap" data-tip="Video quality you receive">
      <i data-icon="gauge"></i>
      <select id="quality" aria-label="Video quality">
        <option value="auto">Auto</option>
        <option value="high">High</option>
        <option value="low">Data saver</option>
      </select>
    </label>
    <button class="ib hidden" id="reloadBtn" aria-label="Reload video" data-tip="Reload the video (R)"><i data-icon="refresh-cw"></i></button>
    </span>
    <button class="ib" id="statsBtn" aria-label="Connection stats" data-tip="Connection stats"><i data-icon="activity"></i></button>
    <button class="ib" id="fullscreenBtn" aria-label="Fullscreen" data-tip="Fullscreen (F)"><i data-icon="maximize"></i></button>
    <button class="ib" id="pinBtn" aria-label="Keep controls visible" data-tip="Keep controls visible (H)"><i data-icon="pin"></i></button>
    <button class="ib" id="leaveBtn" aria-label="Leave room" data-tip="Leave room"><i data-icon="log-out"></i></button>
  </header>

  <!-- Tool rail -->
  <aside class="rail chrome" id="tools" aria-label="Drawing tools">
    <button class="rb on" id="toolPen" aria-label="Pen" data-tip="Pen (P)"><i data-icon="pen-line"></i></button>
    <button class="rb" id="toolMove" aria-label="Move stickers" data-tip="Move and resize stickers (V)"><i data-icon="move"></i></button>
    <div class="railrule"></div>
    <button class="rb" id="colorBtn" aria-label="Colour" data-tip="Colour (1–0)" data-pop="colorPop"><span class="well" id="colorWell"></span></button>
    <button class="rb" id="sizeBtn" aria-label="Pen size and ink" data-tip="Size and ink ([ ])" data-pop="sizePop"><span class="penpreview" id="penPreview"></span></button>
    <button class="rb" id="fadeBtn" aria-label="Vanishing ink" data-tip="Vanishing ink (E)"><i data-icon="sparkles"></i></button>
    <div class="railrule"></div>
    <button class="rb" id="stickerBtn" aria-label="Add sticker" data-tip="Add an image or GIF"><i data-icon="sticker"></i></button>
    <button class="rb hidden" id="arrangeBtn" aria-label="Arrange sticker" data-tip="Arrange: front, back, over or under drawings" data-pop="arrangePop"><i data-icon="layers"></i></button>
    <button class="rb hidden" id="deleteSticker" aria-label="Delete sticker" data-tip="Delete sticker (Del)"><i data-icon="trash-2"></i></button>
    <input type="file" id="stickerFile" accept="image/*" class="hidden" />
    <div class="railrule"></div>
    <button class="rb" id="undoBtn" aria-label="Undo" data-tip="Undo (Ctrl+Z)"><i data-icon="undo-2"></i></button>
    <button class="rb" id="clearMine" aria-label="Clear my drawings" data-tip="Clear my drawings"><i data-icon="eraser"></i></button>
    <button class="rb hidden" id="clearAll" aria-label="Clear someone's drawings" data-tip="Clear someone's drawings, or everyone's" data-pop="clearPop"><i data-icon="brush-cleaning"></i></button>
  </aside>

  <!-- Pop-outs from the rail -->
  <div class="pop chrome" id="colorPop" role="dialog" aria-label="Colour">
    <div class="swatches" id="swatches"></div>
    <label class="custom"><span>Custom</span><input type="color" id="customColor" /></label>
  </div>
  <div class="pop chrome" id="sizePop" role="dialog" aria-label="Pen size and ink">
    <label class="poprow"><span>Size</span><input type="range" id="penSize" min="1" max="16" step="1" /></label>
    <label class="poprow"><span>Vanishing ink lasts</span>
      <select id="fadeTime">
        <option value="1500">1.5 seconds</option><option value="3000" selected>3 seconds</option><option value="6000">6 seconds</option><option value="10000">10 seconds</option>
      </select>
    </label>
  </div>

  <div class="pop menu chrome" id="arrangePop" role="menu" aria-label="Arrange sticker">
    <button role="menuitem" data-order="front"><i data-icon="bring-to-front"></i><span>Bring to front</span><kbd>Ctrl+Shift+]</kbd></button>
    <button role="menuitem" data-order="forward"><i data-icon="chevron-up"></i><span>Bring forward</span><kbd>Ctrl+]</kbd></button>
    <button role="menuitem" data-order="backward"><i data-icon="chevron-down"></i><span>Send backward</span><kbd>Ctrl+[</kbd></button>
    <button role="menuitem" data-order="back"><i data-icon="send-to-back"></i><span>Send to back</span><kbd>Ctrl+Shift+[</kbd></button>
    <div class="menurule"></div>
    <button role="menuitemcheckbox" id="aboveDrawings" aria-checked="false"><i data-icon="pen-line"></i><span>In front of drawings</span><i data-icon="check" class="tick"></i></button>
    <div class="menurule"></div>
    <button role="menuitem" data-order="delete"><i data-icon="trash-2"></i><span>Delete</span><kbd>Del</kbd></button>
  </div>

  <div class="pop menu people chrome" id="clearPop" role="menu" aria-label="Clear drawings">
    <div class="menuhead">Clear drawings</div>
    <div id="clearList"></div>
    <div class="menurule"></div>
    <button role="menuitem" id="clearEveryone"><i data-icon="brush-cleaning"></i><span>Everyone's drawings and stickers</span></button>
  </div>

  <button class="handle" id="uiToggle" aria-label="Show controls" data-tip="Show controls (H)"><i data-icon="sliders-horizontal"></i></button>

  <!-- Share dialog -->
  <dialog id="shareDialog">
    <form method="dialog">
      <div class="head"><h2>Share with the room</h2><button class="ib" value="cancel" aria-label="Close"><i data-icon="x"></i></button></div>
      <div class="body">
        <div id="takeoverNote" class="note hidden"></div>
        <div id="sourcePicker" class="hidden">
          <div class="tabs">
            <button type="button" class="on" data-kind="screen"><i data-icon="monitor"></i>Entire screen</button>
            <button type="button" data-kind="window"><i data-icon="app-window"></i>Application window</button>
            <span class="grow"></span>
            <button type="button" class="ib" id="refreshSources" aria-label="Refresh" data-tip="Refresh"><i data-icon="rotate-cw"></i></button>
          </div>
          <div class="sources" id="sources"></div>
        </div>
        <p id="browserPickerNote" class="muted hidden">After you select <b>Start sharing</b>, your browser asks which screen, window or tab to share.</p>

        <div class="settings">
          <div>
            <span class="field">Send video</span>
            <div class="seg" id="modeRadio">
              <label title="Straight from your computer to each viewer"><input type="radio" name="mode" value="p2p" /><span>Direct</span></label>
              <label title="Uploaded once to the server, which sends it to everyone"><input type="radio" name="mode" value="relay" /><span>Through server</span></label>
            </div>
            <p class="hint" id="modeHint"></p>
          </div>
          <div>
            <span class="field">Optimise for</span>
            <div class="seg">
              <label><input type="radio" name="optimize" value="detail" /><span>Text and detail</span></label>
              <label><input type="radio" name="optimize" value="motion" /><span>Motion and video</span></label>
            </div>
          </div>
          <div>
            <label class="field" for="resSelect">Max resolution</label>
            <select id="resSelect"></select>
          </div>
          <div>
            <label class="field" for="fpsSelect">Frame rate</label>
            <select id="fpsSelect"></select>
          </div>
        </div>

        <label class="check" id="soundBrowser"><input type="checkbox" id="audioCheck" /> <span id="audioLabel">Share sound</span></label>
        <div id="soundDesktop" class="hidden">
          <label class="field" for="soundMode">Sound</label>
          <div class="row">
            <select id="soundMode" class="grow">
              <option value="off">No sound</option>
              <option value="window">Only the shared app</option>
              <option value="system">Everything you hear</option>
              <option value="except">Everything except these apps…</option>
              <option value="apps">Only these apps…</option>
              <option value="devices">Only these output devices…</option>
            </select>
            <button type="button" class="ib" id="refreshSound" aria-label="Refresh apps and devices" data-tip="Refresh"><i data-icon="rotate-cw"></i></button>
          </div>
          <div class="picklist hidden" id="soundPick"></div>
          <p class="hint" id="soundNote"></p>
        </div>
      </div>
      <div class="foot">
        <span class="error" id="shareError"></span>
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" value="start" id="startShare">Start sharing</button>
      </div>
    </form>
  </dialog>

  <!-- Your name and cursor colour -->
  <dialog id="profileDialog" class="narrow">
    <form method="dialog">
      <div class="head"><h2>Your name and cursor</h2><button class="ib" value="cancel" aria-label="Close"><i data-icon="x"></i></button></div>
      <div class="body">
        <label class="field" for="profileName">Name</label>
        <input id="profileName" type="text" maxlength="24" />
        <span class="field">Cursor colour</span>
        <div class="colorgrid" id="profileColors"></div>
        <label class="custom"><span>Custom</span><input type="color" id="profileCustom" /></label>
      </div>
      <div class="foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save">Save</button></div>
    </form>
  </dialog>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/board.js"></script>
  <script src="js/input.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/p2p.js"></script>
  <script src="js/relay.js"></script>
  <script src="js/room.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/update.js"></script>
</body>
</html>
