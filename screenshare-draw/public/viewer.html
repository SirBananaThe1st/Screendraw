<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScreenDraw — viewing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="group" id="pen"></div>
      <div class="sep"></div>
      <div class="group">
        <button id="undo" title="Undo your last stroke (Ctrl+Z)">Undo</button>
        <button id="clear" class="danger" title="Remove all of your strokes">Clear mine</button>
      </div>
      <div class="spacer"></div>
      <span class="status warn" id="status">Connecting…</span>
      <button id="fullscreen" title="Fullscreen (F)">⛶</button>
    </div>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="pen"></canvas>
      <div class="empty" id="empty">Waiting for the screen share to start…</div>
    </div>
  </div>
  <script src="rtc.js"></script>
  <script src="tools.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
