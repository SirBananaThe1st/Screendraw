<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScreenDraw — sharing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button class="primary" id="start">Start sharing</button>
      <button id="stop" class="danger hidden">Stop</button>
      <div class="sep"></div>
      <span>Room <span class="code" id="room" style="font-size:16px"></span></span>
      <button id="copy">Copy viewer link</button>
      <div class="sep"></div>
      <div class="group" id="pen"></div>
      <button id="clear" class="danger" title="Remove everyone's drawings">Clear all</button>
      <div class="spacer"></div>
      <span class="status" id="status">Not sharing</span>
    </div>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="pen"></canvas>
      <div class="empty" id="empty">
        <div>
          <p>Click <b>Start sharing</b>, then send viewers the link.</p>
          <p class="note">In the browser, drawings appear over this preview only.<br />
          Use the desktop app for a transparent overlay on your real screen.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="rtc.js"></script>
  <script src="tools.js"></script>
  <script src="share.js"></script>
</body>
</html>
