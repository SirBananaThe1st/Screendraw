<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src *; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:" />
  <title>ScreenDraw</title>
  <link rel="stylesheet" href="../public/style.css" />
  <style>
    body { overflow-y: auto; }
    .wrap { padding: 18px; }
    h1 { font-size: 20px; margin: 0 0 2px; }
    .preview { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-top: 14px; border: 1px solid var(--line); }
    .preview video { width: 100%; height: 100%; object-fit: contain; }
    .preview canvas { position: absolute; pointer-events: none; }
    .live { margin-top: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .toggle { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; margin-top: 14px; }
    .warnbox { background: #2a2210; border: 1px solid #5a4613; color: #ffd98a; border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ScreenDraw</h1>
    <div class="note">Share your screen; viewers' drawings appear on top of it.</div>

    <div id="setup">
      <label for="server">Signalling server</label>
      <input id="server" type="url" value="http://localhost:8080" />
      <div class="warnbox hidden" id="localWarn">
        Viewers on other machines can't open <b>localhost</b>. Use the network address the
        server printed (e.g. http://192.168.1.20:8080) or a public URL.
      </div>

      <label for="display">Screen to share</label>
      <select id="display"></select>

      <div class="actions">
        <button class="primary" id="start">Start sharing</button>
      </div>
      <div class="note" id="error" style="color:#ff9a9a;margin-top:8px"></div>
    </div>

    <div id="live" class="live hidden">
      <span class="status ok" id="status">Sharing</span>
      <label>Room code</label>
      <div class="row">
        <span class="code" id="room"></span>
        <span class="spacer" style="flex:1"></span>
        <button id="copy">Copy viewer link</button>
      </div>
      <div class="note" id="link" style="word-break:break-all;margin-top:6px"></div>

      <label class="toggle"><input type="checkbox" id="showOverlay" checked /> Show drawings on my screen</label>

      <div class="actions">
        <button class="danger" id="clear">Clear all drawings</button>
        <button class="danger" id="stop">Stop sharing</button>
      </div>
    </div>

    <div class="preview">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <script src="../public/rtc.js"></script>
  <script src="control.js"></script>
</body>
</html>
