<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScreenDraw</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>ScreenDraw</h1>
      <p>Peer-to-peer screen sharing that everyone can draw on.</p>

      <label for="room">Join a share — enter the room code</label>
      <form class="row" id="join">
        <input id="room" type="text" placeholder="e.g. k7m2qp" autocomplete="off" required />
        <button class="primary" type="submit">Join</button>
      </form>

      <div class="divider"></div>

      <button id="share" style="width:100%">Share my screen from this browser</button>
      <p class="note" style="margin-top:10px">
        To see viewers' drawings as a transparent layer on top of your actual desktop,
        share with the desktop app instead (<code>npm run sharer</code>). The browser
        can only show them over a preview.
      </p>
    </div>
  </div>
  <script>
    document.getElementById('join').onsubmit = (e) => {
      e.preventDefault();
      const room = document.getElementById('room').value.trim().toLowerCase();
      if (room) location.href = `viewer.html?room=${encodeURIComponent(room)}`;
    };
    document.getElementById('share').onclick = () => (location.href = 'share.html');
  </script>
</body>
</html>
